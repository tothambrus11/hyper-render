[package]
name = "hyper-render"
version = "0.2.2"
edition = "2021"
description = "A Chromium-free HTML rendering engine for generating PNG and PDF outputs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thomasmost/hyper-render"
documentation = "https://docs.rs/hyper-render"
readme = "README.md"
keywords = ["html", "pdf", "png", "render", "headless"]
categories = ["rendering", "graphics", "multimedia::images"]

[features]
default = ["png", "pdf", "net"]
png = ["dep:anyrender", "dep:anyrender_vello_cpu", "dep:png"]
pdf = ["dep:krilla", "dep:stylo", "dep:parley", "dep:linebender_resource_handle"]
# Fetch remote resources (images, stylesheets, fonts) over http(s)/file/data URLs
net = ["dep:blitz-net", "dep:tokio"]

[dependencies]
# Core HTML/CSS parsing and layout (always required)
blitz-dom = "0.2"
blitz-html = "0.2"
blitz-traits = "0.2"
blitz-paint = "0.2"

# PNG rendering (optional, enabled by default)
anyrender = { version = "0.6", optional = true }
anyrender_vello_cpu = { version = "0.7", optional = true }
png = { version = "0.17", optional = true }

# PDF rendering (optional, enabled by default)
krilla = { version = "0.6", optional = true }
stylo = { version = "0.8", optional = true }  # For accessing computed styles in PDF rendering
parley = { version = "0.6", optional = true }  # For text layout types
linebender_resource_handle = { version = "0.1", optional = true }  # For font data types

# Network resource loading (optional, enabled by default)
blitz-net = { version = "0.2.1", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "sync", "time"] }

# Common dependencies
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
criterion = { version = "0.5", features = ["html_reports"] }
pdf-extract = "0.10"
pprof = { version = "0.14", features = ["flamegraph", "frame-pointer"] }

[profile.profiling]
inherits = "release"
debug = 1              # line-level symbols for readable flamegraphs
strip = "none"
force-frame-pointers = true   # required by pprof frame-pointer unwinder

[[bench]]
name = "render"
harness = false

[[bench]]
name = "parallel_throughput"
harness = false

[[example]]
name = "bench_worker"
path = "examples/bench_worker.rs"

[[example]]
name = "parallel_scaling"
path = "examples/parallel_scaling.rs"

[[example]]
name = "time_setup"
path = "examples/time_setup.rs"

[[example]]
name = "profile_parallel"
path = "examples/profile_parallel.rs"

[[example]]
name = "simple"
path = "examples/simple.rs"

[[example]]
name = "from_file"
path = "examples/from_file.rs"

[[example]]
name = "remote_image"
path = "examples/remote_image.rs"
required-features = ["net"]
